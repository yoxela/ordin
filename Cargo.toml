[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/yoxela/ordin"
# Nothing is published until it is genuinely useful (crates.io forbids
# name-reserving placeholder crates).
publish = false

[workspace.dependencies]
# Test harnesses (ORD-003). Crates opt in under [dev-dependencies] with
# `proptest.workspace = true` or `insta.workspace = true`.
proptest = "1.12.0"
insta = "1.49.0"

# Typed errors in library crates (CLAUDE.md: libraries use thiserror, only
# binaries use anyhow).
thiserror = "2.0.21"

# Serialization. Layer-0 types implement serde by hand, as their string
# form, so nothing invalid can be deserialized.
serde = "1.0.229"
serde_json = "1.0.154"

# Hashing (the architecture's Technology choices): BLAKE3 is every Ordin
# object's identity. Wrapped by ordin-core's Digest.
blake3 = "1.8.7"
# SHA-256, for fs-verity digests (ORD-102). Wrapped by ordin-tree's FileHasher.
sha2 = "0.11.1"
# Safe system calls, for what std doesn't offer: walking a tree relative to
# open directories, statx and extended attributes (ORD-110).
rustix = { version = "1.1.6", features = ["fs"] }
# Checks setting patterns without compiling or running them (ORD-013).
regex-syntax = "0.8.11"
# Compression of the chunk packs in .ordin files (ORD-130). Builds the bundled
# libzstd (C) unless ZSTD_SYS_USE_PKG_CONFIG is set, which release builds never
# set: compressed bytes depend on the library version, so Cargo.lock pins it.
# The legacy formats and the dictionary builder are left out.
zstd = { version = "0.14.4", default-features = false }
# Anonymous temporary files: spooling chunk packs while a .ordin file is
# written (ORD-130), and test fixtures.
tempfile = "3.27.0"
# Reading ELF files for requirements and provides (ORD-112), behind
# ordin-pack's elf module. Only the ELF reader: no other formats, no
# decompression. ordind may never link it (ORDIND_DENYLIST).
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "std"] }
# The command line (ORD-120): argument parsing without color or terminal
# detection, and errors with context in binaries only.
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
anyhow = "1.0.104"
# Tests only: reading tar archives as a second opinion on Ordin's own writer.
tar = { version = "0.4.46", default-features = false }

# Every crate inherits these, except ordin-store and ordin-sandbox, which
# repeat them with unsafe_code = "deny" instead of "forbid".
# `cargo xtask check-layers` keeps those two copies in step.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Libraries never panic on bad input. clippy.toml allows these in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# The layer-0 I/O bans live in each layer-0 crate's clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"

# Release builds are reproducible (ORD-004): one codegen unit, so the output
# doesn't depend on how work was split, and no debug information, which
# would carry build paths.
[profile.release]
codegen-units = 1
strip = "debuginfo"
