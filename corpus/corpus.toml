# The dogfood corpus (ORD-152): real upstream artifacts that
# `cargo xtask corpus` downloads, checks, lays out as install roots and packs
# with `ordin pack`, comparing `ordin show --json` with corpus/<name>/show.json.
# corpus/README.md describes every key.
#
# Each source is pinned by its size and SHA-256, checked before anything reads
# it. A hash here was compared with a second source when it was added:
# GitHub's asset digest for ripgrep, go.dev/dl for Go, and the trixie
# Packages index on deb.debian.org for the Debian packages, whose URLs are on
# snapshot.debian.org so they never go away.

format = 1

[[package]]
name = "ripgrep-x86_64"
about = "a static binary (musl) for x86_64, laid out from an upstream release tarball"
licenses = { MIT = "usr/share/doc/ripgrep/LICENSE-MIT", Unlicense = "usr/share/doc/ripgrep/UNLICENSE" }

[[package.source]]
url = "https://github.com/BurntSushi/ripgrep/releases/download/16.0.0/ripgrep-16.0.0-x86_64-unknown-linux-musl.tar.gz"
size = 2230229
sha256 = "54268ab4643c00a290a29b0086066d64b3f56236dd805ec64629a86f9bd29fd0"
format = "tar.gz"
strip = 1
place = [
    { from = "rg", to = "usr/bin/rg" },
    { from = "doc", to = "usr/share/doc/ripgrep" },
    { from = "doc/rg.1", to = "usr/share/man/man1/rg.1" },
    { from = "README.md", to = "usr/share/doc/ripgrep/README.md" },
    { from = "COPYING", to = "usr/share/doc/ripgrep/COPYING" },
    { from = "LICENSE-MIT", to = "usr/share/doc/ripgrep/LICENSE-MIT" },
    { from = "UNLICENSE", to = "usr/share/doc/ripgrep/UNLICENSE" },
    { from = "complete/rg.bash", to = "usr/share/bash-completion/completions/rg" },
    { from = "complete/rg.fish", to = "usr/share/fish/vendor_completions.d/rg.fish" },
    { from = "complete/_rg", to = "usr/share/zsh/site-functions/_rg" },
]
exclude = [
    { path = "complete/_rg.ps1", reason = "a PowerShell completion" },
    { path = "complete/rg-completions.nu", reason = "nushell has no system-wide completion directory yet" },
]

