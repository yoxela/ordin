#
# The recipe for a corpus package (ORD-152); corpus/corpus.toml says where
# its files come from, and the license texts are given with --license-file.

format = 1

[package]
name     = "ripgrep"
version  = "16.0.0"
summary  = "Searches directories recursively for a regular expression"
homepage = "https://github.com/BurntSushi/ripgrep"
license  = "Unlicense OR MIT"
