#
# The recipe for a corpus package (ORD-152); corpus/corpus.toml says where
# its files come from, and the license texts are given with --license-file.

format = 1

[package]
name     = "logrotate"
version  = "3.22.0"
summary  = "Rotates, compresses and removes log files"
homepage = "https://github.com/logrotate/logrotate"
license  = "GPL-2.0-only AND BSD-3-Clause"

[[unit]]
name   = "logrotate.timer"
preset = "enable"
