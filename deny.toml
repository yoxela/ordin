# cargo-deny policy. See CLAUDE.md and the architecture's Technology choices.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and yanked versions fail the check. Unmaintained
# crates are reported so they can be replaced deliberately.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Third-party dependencies must be permissive. Anything else (MPL-2.0, LGPL,
# GPL, ...) needs the maintainer's decision first. Ordin's own crates are
# unpublished and checked by the ORD-002 layer and license rules instead.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # zstd and its bundled libzstd (ORD-130).
  "BSD-2-Clause",
  "BSD-3-Clause",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
