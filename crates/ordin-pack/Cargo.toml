ordin-manifest = { path = "../ordin-manifest" }
ordin-recipe = { path = "../ordin-recipe" }
ordin-sign = { path = "../ordin-sign" }
ordin-tree = { path = "../ordin-tree" }
ordin-version = { path = "../ordin-version" }
rustix.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Writing ELF fixtures in tests.
object = { workspace = true, features = ["write_std"] }
proptest.workspace = true
serde_json.workspace = true
tar.workspace = true
zstd.workspace = true

[lints]
workspace = true
