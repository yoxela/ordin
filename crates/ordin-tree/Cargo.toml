[package]
name = "ordin-tree"
description = "Tree entries, the chunk index and the content-defined chunker, with their canonical encodings and digests"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.ordin]
layer = 0

[dependencies]
ordin-core = { path = "../ordin-core" }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
# Cross-checks Ordin's own FastCDC against the crate ORD-100 measured with.
# Tests only: a crate update must never change Ordin's cut points.
fastcdc = { version = "=3.2.1", default-features = false }

[lints]
workspace = true
