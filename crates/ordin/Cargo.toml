[package]
name = "ordin"
description = "The ordin command-line interface"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.ordin]
layer = 3

[[bin]]
name = "ordin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ordin-archive = { path = "../ordin-archive" }
ordin-core = { path = "../ordin-core" }
ordin-manifest = { path = "../ordin-manifest" }
ordin-pack = { path = "../ordin-pack" }
ordin-sign = { path = "../ordin-sign" }
ordin-tree = { path = "../ordin-tree" }
ordin-version = { path = "../ordin-version" }
rustix = { workspace = true, features = ["termios"] }
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
insta.workspace = true
rustix = { workspace = true, features = ["pty"] }
serde_json.workspace = true

[lints]
workspace = true
