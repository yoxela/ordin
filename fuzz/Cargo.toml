# Fuzz targets for Ordin, built with cargo-fuzz on the nightly toolchain
# pinned in fuzz/rust-toolchain.toml. This is its own Cargo workspace, so
# the stable workspace never builds nightly-only code.
#
# Add a target with `cargo fuzz add <name>` from this directory. Every
# parser of outside input gets one (see CLAUDE.md's definition of done).

[package]
name = "ordin-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "std"] }
ordin-archive = { path = "../crates/ordin-archive" }
ordin-core = { path = "../crates/ordin-core" }
ordin-depexpr = { path = "../crates/ordin-depexpr" }
ordin-manifest = { path = "../crates/ordin-manifest" }
ordin-pack = { path = "../crates/ordin-pack" }
ordin-recipe = { path = "../crates/ordin-recipe" }
ordin-sign = { path = "../crates/ordin-sign" }
ordin-tree = { path = "../crates/ordin-tree" }
ordin-version = { path = "../crates/ordin-version" }

[[bin]]
name = "atom_parse"
path = "fuzz_targets/atom_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "depexpr_parse"
path = "fuzz_targets/depexpr_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "elf_inspect"
path = "fuzz_targets/elf_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_caps"
path = "fuzz_targets/file_caps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_index_parse"
path = "fuzz_targets/chunk_index_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ordin_read"
path = "fuzz_targets/ordin_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_parse"
path = "fuzz_targets/tree_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_parse"
path = "fuzz_targets/version_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "signature_parse"
path = "fuzz_targets/signature_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_key_parse"
path = "fuzz_targets/public_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_key_parse"
