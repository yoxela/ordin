# Scheduled checks (ORD-003): fuzzing, a whole-workspace mutation run and
# branch coverage. The pinned nightly lives in fuzz/rust-toolchain.toml.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  FUZZ_SECONDS: "600"

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the fuzz targets
        id: targets
        run: |
          shopt -s nullglob
          targets=()
          for f in fuzz/fuzz_targets/*.rs; do
            targets+=("$(basename "$f" .rs)")
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No fuzz targets yet; the first arrives with ORD-011." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "list=${targets[*]}" >> "$GITHUB_OUTPUT"
      - name: Install the pinned nightly (fuzz/rust-toolchain.toml)
        if: steps.targets.outputs.list != ''
        working-directory: fuzz
        run: rustup install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.targets.outputs.list != ''
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('fuzz/rust-toolchain.toml') }}
      - name: Install cargo-fuzz
        if: steps.targets.outputs.list != '' && steps.tool-cache.outputs.cache-hit != 'true'
        working-directory: fuzz
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          cargo "+$toolchain" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Fuzz each target
        if: steps.targets.outputs.list != ''
        id: run
        working-directory: fuzz
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          crashed=()
          for t in $TARGETS; do
            if ! cargo fuzz run "$t" -- -max_total_time="$FUZZ_SECONDS"; then
              if compgen -G "artifacts/$t/*" > /dev/null; then
                crashed+=("$t")
              else
                echo "cargo fuzz run failed for $t without leaving a crashing input"
                exit 1
              fi
            fi
          done
          echo "crashed=${crashed[*]}" >> "$GITHUB_OUTPUT"
      - name: Keep the crashing inputs
        if: steps.run.outputs.crashed != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14
      # A crash in a parser can be a security bug, so the issue names only
      # the target. The reproducer stays in the run's artifact.
      - name: Open or update an issue per crashed target
        if: steps.run.outputs.crashed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CRASHED: ${{ steps.run.outputs.crashed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create fuzz-crash --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "A nightly fuzz run crashed"
          for t in $CRASHED; do
            title="Fuzz crash in target $t"
            body="$(printf '%s\n' \
              "The nightly fuzz run crashed in the \`$t\` target: $RUN_URL" \
              "" \
              "The crashing input is in that run's \`fuzz-artifacts\` artifact (kept 14 days), not in this issue." \
              "To reproduce, download it and run \`cargo fuzz run $t <input>\` from \`fuzz/\`.")"
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label fuzz-crash --state open \
              --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label fuzz-crash --body "$body"
            fi
          done
          echo "Crashed: $CRASHED" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  mutants:
    name: mutants (whole workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-mutants
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          cargo "+$toolchain" install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      # Report only: 0, 2 (missed) and 3 (timeouts) are results, anything
      # else is a failure to run.
      - name: Test every mutant in the workspace
        run: |
          set +e
          cargo mutants --workspace --jobs 2 --no-shuffle
          rc=$?
          set -e
          {
            echo "### Whole-workspace mutation run"
            for kind in caught missed timeout unviable; do
              n=0
              [ -f "mutants.out/$kind.txt" ] && n="$(wc -l < "mutants.out/$kind.txt")"
              echo "- $kind: $n"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0|2|3) exit 0 ;;
            *) exit "$rc" ;;
          esac
      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14

  branch-coverage:
    name: branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stable can't measure branches, so this uses the pinned nightly. The
      # stable toolchain is still installed to build cargo-llvm-cov.
      - name: Install the toolchains
        run: |
          rustup install
          nightly="$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)"
          test -n "$nightly"
          rustup toolchain install "$nightly" --profile minimal --component llvm-tools-preview
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-llvm-cov
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          cargo "+$toolchain" install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure branch coverage
        run: |
          cargo "+$NIGHTLY" llvm-cov --workspace --locked --branch --summary-only
          branches="$(cargo "+$NIGHTLY" llvm-cov report --branch --summary-only --json | jq -r '.data[0].totals.branches.percent')"
          printf '### Branch coverage: %.2f%% (nightly, reported only)\n' "$branches" >> "$GITHUB_STEP_SUMMARY"
